<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-labelledby="t d">
<title id="t">Walk cycle: foot contact and body height</title>
<desc id="d">Top: which feet are on the ground in each of the 30 frames of the walk, in the order right hind, right front, left hind, left front, each a quarter cycle apart. Bottom: the pelvis height over the same frames, moving up and down by about 3 cm twice per stride.</desc>
<style>
 svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
 :root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e4e3df;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100}
 @media (prefers-color-scheme:dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#34332f;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500}}
 .bg{fill:var(--surface)} .ink{fill:var(--ink)} .ink2{fill:var(--ink2)} .grid{stroke:var(--grid);stroke-width:1}
 .lbl{font-size:13px} .small{font-size:11.5px} .title{font-size:15px;font-weight:600}
 .s1{fill:var(--s1)} .s2{fill:var(--s2)} .s3{fill:var(--s3)} .s4{fill:var(--s4)}
 .line{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
 .dot{fill:var(--s1);stroke:var(--surface);stroke-width:2}
</style>
<rect class="bg" width="720" height="520"/>
<text class="title ink" x="110" y="28">Which feet are on the ground</text>
<text class="small ink2" x="110" y="46">Bar = foot planted. Gap = foot in the air. One stride, 30 frames.</text>
<text class="lbl ink" x="98" y="79" text-anchor="end">Right hind</text>
<line class="grid" x1="110" x2="690" y1="72" y2="72" stroke-dasharray="2 4"/>
<rect class="s1" x="111.0" y="65" width="365.3" height="14" rx="4"><title>Right hind: planted frames 1-19</title></rect>
<text class="lbl ink" x="98" y="113" text-anchor="end">Right front</text>
<line class="grid" x1="110" x2="690" y1="106" y2="106" stroke-dasharray="2 4"/>
<rect class="s2" x="265.7" y="99" width="346.0" height="14" rx="4"><title>Right front: planted frames 9-26</title></rect>
<text class="lbl ink" x="98" y="147" text-anchor="end">Left hind</text>
<line class="grid" x1="110" x2="690" y1="140" y2="140" stroke-dasharray="2 4"/>
<rect class="s3" x="111.0" y="133" width="75.3" height="14" rx="4"><title>Left hind: planted frames 1-4</title></rect>
<rect class="s3" x="401.0" y="133" width="288.0" height="14" rx="4"><title>Left hind: planted frames 16-30</title></rect>
<text class="lbl ink" x="98" y="181" text-anchor="end">Left front</text>
<line class="grid" x1="110" x2="690" y1="174" y2="174" stroke-dasharray="2 4"/>
<rect class="s4" x="111.0" y="167" width="210.7" height="14" rx="4"><title>Left front: planted frames 1-11</title></rect>
<rect class="s4" x="555.7" y="167" width="133.3" height="14" rx="4"><title>Left front: planted frames 24-30</title></rect>
<text class="small ink2" x="119.7" y="202" text-anchor="middle">1</text>
<text class="small ink2" x="216.3" y="202" text-anchor="middle">6</text>
<text class="small ink2" x="313.0" y="202" text-anchor="middle">11</text>
<text class="small ink2" x="409.7" y="202" text-anchor="middle">16</text>
<text class="small ink2" x="506.3" y="202" text-anchor="middle">21</text>
<text class="small ink2" x="603.0" y="202" text-anchor="middle">26</text>
<text class="small ink2" x="680.3" y="202" text-anchor="middle">30</text>
<text class="small ink2" x="400.0" y="220" text-anchor="middle">frame</text>
<text class="title ink" x="110" y="258">Body height</text>
<text class="small ink2" x="110" y="276">Pelvis height over the same frames. The body dips twice per stride.</text>
<line class="grid" x1="110" x2="690" y1="436.5" y2="436.5"/>
<text class="small ink2" x="98" y="440.5" text-anchor="end">102.9 cm</text>
<line class="grid" x1="110" x2="690" y1="373.1" y2="373.1"/>
<text class="small ink2" x="98" y="377.1" text-anchor="end">104.4 cm</text>
<line class="grid" x1="110" x2="690" y1="309.7" y2="309.7"/>
<text class="small ink2" x="98" y="313.7" text-anchor="end">105.9 cm</text>
<polyline class="line" points="119.7,370.8 139.0,396.7 158.3,418.3 177.7,431.9 197.0,435.1 216.3,427.4 235.7,410.1 255.0,386.2 274.3,359.8 293.7,335.5 313.0,317.5 332.3,308.9 351.7,311.2 371.0,324.0 390.3,345.1 409.7,370.8 429.0,396.7 448.3,418.3 467.7,431.9 487.0,435.1 506.3,427.4 525.7,410.1 545.0,386.2 564.3,359.8 583.7,335.5 603.0,317.5 622.3,308.9 641.7,311.2 661.0,324.0 680.3,345.1"/>
<circle class="dot" cx="332.3" cy="308.9" r="4.5"><title>frame 12: 105.9 cm</title></circle>
<text class="small ink" x="332.3" y="298.9" text-anchor="middle">highest 105.9 cm</text>
<circle class="dot" cx="197.0" cy="435.1" r="4.5"><title>frame 5: 102.9 cm</title></circle>
<text class="small ink" x="197.0" y="455.1" text-anchor="middle">lowest 102.9 cm</text>
<text class="small ink2" x="119.7" y="474" text-anchor="middle">1</text>
<text class="small ink2" x="216.3" y="474" text-anchor="middle">6</text>
<text class="small ink2" x="313.0" y="474" text-anchor="middle">11</text>
<text class="small ink2" x="409.7" y="474" text-anchor="middle">16</text>
<text class="small ink2" x="506.3" y="474" text-anchor="middle">21</text>
<text class="small ink2" x="603.0" y="474" text-anchor="middle">26</text>
<text class="small ink2" x="680.3" y="474" text-anchor="middle">30</text>
<text class="small ink2" x="400.0" y="494" text-anchor="middle">frame</text>
<text class="small ink2" x="110" y="506">Swing in the pelvis: 3.0 cm. Feet measured from the animated rig in Blender.</text>
</svg>