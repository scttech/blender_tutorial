# The static lunge (split squat) with fists on the hips, as text. The legs and the solved hip height are the generator `lunge_at_knee`
# (lunge.py); the arms ride on the hips (poselib.py), so they follow the hips down.
name = "Lunge"
python = ["lunge.py", "poselib.py"]
timeline = [[1, "top"], [25, "bottom"], [33, "bottom"], [57, "top"]]        # 0.83 s down, 0.27 s pause, 0.8 s up

[params]
knee_top = 18.0       # the front knee's bend standing tall in the split (degrees)
knee_bottom = 95.0    # ... and at the bottom

[poses.hands_on_hips]
post = [ { fn = "ride_arms", args = { style = "hips_fists" } } ]
[poses.top]
extends = "hands_on_hips"
generator = "lunge_at_knee"
args = { knee = "=knee_top" }
[poses.bottom]
extends = "hands_on_hips"
generator = "lunge_at_knee"
args = { knee = "=knee_bottom" }
