# Triceps pushdown: stand at the high cable with the elbows pinned at the sides; push the handle down until the arms are straight and return. 1.2 s up, 0.3 s hold, 1.5 s down. The machine is not modelled.
name = "TricepPushdown"
python = ["moves.py", "poselib.py", "machines.py"]
timeline = [{ frames = [1, 37, 3], pose = "m", set = { h = "=(1-cos(pi*(f-1)/36))/2" } },
            { frames = [46, 91, 3], pose = "m", set = { h = "=(1+cos(pi*(f-46)/45))/2" } }]

[params]
h = 0

[poses.m]
generator = "tricep_pushdown"
args = { h = "=h" }
