# The bodyweight squat, as text, with the hands behind the head. (squat.py, Step 13, is the original with the arms held forward; that version let the elbows flare.)
# The feet do not move: the Foot_IK controls stay at rest, the knees bend because the hips drop. 30 fps, 2.0 s loop.
name = "Squat"
python = "poselib.py"
# (timeline is above the [tables] on purpose: in TOML a key written after a [table] heading belongs to that table)
timeline = [[1, "stand"], [25, "bottom"], [33, "bottom"], [61, "stand"]]    # 0.8 s down, 0.27 s pause, 0.93 s up

[params]
depth = 0.58        # how far the hips drop (m). 0.58 puts the thighs just below parallel
sit_back = 0.14     # how far the hips move back at the bottom (m)

# the body, without the arms: variants of the squat swap the arms (see the poses `arms_*` below) and keep this
[poses.body_stand]
Hips = { move = [0, 0, 0] }
Spine = { rot = [0, 0, 0] }
Spine1 = { rot = [0, 0, 0] }
Spine2 = { rot = [0, 0, 0] }
Neck = { rot = [0, 0, 0] }
Head = { rot = [0, 0, 0] }
[poses.body_bottom]
Hips = { move = [0, "=sit_back", "=-depth"] }
Spine = { rot = [14, 0, 0] }        # 30 degrees of forward lean in all
Spine1 = { rot = [10, 0, 0] }
Spine2 = { rot = [6, 0, 0] }
Neck = { rot = [-8, 0, 0] }         # keep the eyes forward
Head = { rot = [-14, 0, 0] }

# the arms: hands behind the head, elbows wide (they ride on the head, so they follow the lean). Variants swap this for other arm positions.
[poses.arms_stand]
post = [ { fn = "ride_arms", args = { style = "behind_head" } } ]
[poses.arms_bottom]
post = [ { fn = "ride_arms", args = { style = "behind_head" } } ]

[poses.stand]
extends = ["body_stand", "arms_stand"]
[poses.bottom]
extends = ["body_bottom", "arms_bottom"]
