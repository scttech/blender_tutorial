# T-bar row: bent over the bar with the knees bent and the back flat; drive the elbows back to pull the handle to the chest; lower. 1.2 s up, 0.3 s hold, 1.5 s down. The machine is not modelled.
name = "TBarRow"
python = ["moves.py", "poselib.py", "machines.py"]
timeline = [{ frames = [1, 37, 3], pose = "m", set = { h = "=(1-cos(pi*(f-1)/36))/2" } },
            { frames = [46, 91, 3], pose = "m", set = { h = "=(1+cos(pi*(f-46)/45))/2" } }]

[params]
h = 0

[poses.m]
generator = "tbar_row"
args = { h = "=h" }
