# Leg raise: on the back, hands at the sides on the floor. Raise the straight legs to 60 degrees above the floor (not vertical: a full 90 degree hip bend turned the right hip's texture white) and lower them under control (the legs stop just above the floor).
name = "LegRaise"
python = ["situp.py", "poselib.py"]
timeline = [{ frames = [1, 31, 3], pose = "legs", set = { g = "=30+50*(1+cos(pi*(f-1)/30))/2" } },
            { frames = [37, 67, 3], pose = "legs", set = { g = "=30+50*(1-cos(pi*(f-37)/30))/2" } }]       # 1.0 s up, 0.2 s pause, 1.0 s down

[params]
g = 80

[poses.legs]
generator = "curl_body"
args = { t = 0 }
post = [ { fn = "arms_on_floor", args = { reach = 0.42, x = 0.28 } }, { fn = "lying_legs", args = { gl = "=g", kl = 0.5, gr = "=g", kr = 0.5, foot = -45 } } ]
