# Kettlebell lunge: the static lunge with a kettlebell held at the chest (goblet position).
name = "KettlebellLunge"
extends = "Lunge"
python = ["poselib.py", "kbswing.py"]

[params]
ky = -0.30
kz = 1.24

[poses.hands_on_hips]
post = [ { fn = "ride_prop", args = { prop = "Kettlebell", at = [0, "=ky", "=kz"], grab = "grab_kb_goblet", pole = [0.40, -0.05, 1.15] } } ]
