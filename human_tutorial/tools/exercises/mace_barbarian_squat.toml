# Mace barbarian squat: the squat with the mace across the upper back behind the head, hands on the handle, chest tall.
name = "MaceBarbarianSquat"
extends = "Squat"
python = ["mace.py", "poselib.py"]

[poses.arms_stand]
post = [ { fn = "ride_prop", args = { prop = "Mace", at = [0.27, 0.07, 1.60], rot = [0, -90, 0], grab = "grab_mace", pole = [0.65, 0.10, 1.75] } } ]
[poses.arms_bottom]
post = [ { fn = "ride_prop", args = { prop = "Mace", at = [0.27, 0.07, 1.60], rot = [0, -90, 0], grab = "grab_mace", pole = [0.65, 0.10, 1.75] } } ]
[poses.body_bottom]
Spine = { rot = [9, 0, 0] }
Spine1 = { rot = [7, 0, 0] }
Spine2 = { rot = [4, 0, 0] }
Neck = { rot = [-5, 0, 0] }
Head = { rot = [-8, 0, 0] }
