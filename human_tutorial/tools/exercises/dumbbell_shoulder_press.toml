# Dumbbell shoulder press: a dumbbell at each shoulder, palms forward. Press them overhead until the arms are straight, then lower to the shoulders. 1.2 s up, 0.3 s hold, 1.5 s down.
name = "DumbbellShoulderPress"
python = ["moves.py", "poselib.py", "dumbbell.py"]
timeline = [{ frames = [1, 37, 3], pose = "press", set = { h = "=(1-cos(pi*(f-1)/36))/2" } },
            { frames = [46, 91, 3], pose = "press", set = { h = "=(1+cos(pi*(f-46)/45))/2" } }]

[params]
h = 0

[poses.press]
generator = "db_press"
args = { h = "=h", turn = 1 }
