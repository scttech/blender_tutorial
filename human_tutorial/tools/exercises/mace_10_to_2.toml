# The steel mace 10-to-2: both hands on the handle behind the neck, the head hanging down behind the back. Swing it up behind one shoulder to
# 10 o'clock, back down, up behind the other shoulder to 2 o'clock, and down. (The first version of this exercise, Step 16, held the mace in
# front of the chest; that is mace.py's MACE_10_TO_2 and is no longer the exercise.)
name = "Mace10to2"
python = "mace.py"
timeline = [{ frames = [1, 61, 1], pose = "swing" }]       # 2.0 s: left, down, right, down; keyed every frame (every 3 left the hands 111 mm out of reach between keys)

[params]
swing = 120         # degrees from hanging straight down to the head at 10 or 2 o'clock
px = 0.0           # the pivot (the midpoint of the hands): x,
py = 0.18           # the pivot (the midpoint of the hands): y behind the spine (level with the back of the head),
pz = 1.72 # ... and its height

[poses.swing]
generator = "mace_behind"
args = { theta = "=swing*sin(2*pi*(f-1)/60)", px = "=px", py = "=py", pz = "=pz" }
