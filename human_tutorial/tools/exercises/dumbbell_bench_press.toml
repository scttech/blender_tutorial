# Dumbbell bench press: lie on a flat bench, feet on the floor, a dumbbell in each hand at the chest. Press them up until the arms are straight over the chest, then lower to the chest.
# 1.2 s up, 0.3 s hold, 1.5 s down. The back lies on the bench (situp.bench_body); the dumbbells are placed from the shoulders (dumbbell.db_lying).
name = "DumbbellBenchPress"
python = ["situp.py", "poselib.py", "dumbbell.py"]
timeline = [{ frames = [1, 37, 3], pose = "press", set = { h = "=(1-cos(pi*(f-1)/36))/2" } },
            { frames = [46, 91, 3], pose = "press", set = { h = "=(1+cos(pi*(f-46)/45))/2" } }]

[params]
h = 0

[poses.press]
generator = "bench_body"
args = { t = 0 }
post = [ { fn = "db_lying", args = { mode = "press", h = "=h" } } ]
