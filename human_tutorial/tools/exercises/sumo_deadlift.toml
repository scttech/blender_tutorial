# Sumo deadlift: a wide stance, toes out, hands inside the knees on the bar with a narrow overhand grip. Push the floor apart and stand tall, then lower the bar under control.
name = "SumoDeadlift"
extends = "Deadlift"

[params]
back = 0.25
drop = 0.45
pitch = 45.0
stance = 0.42
y_floor = -0.12

[poses.lift]
generator = "hinge_body"
args = { t = "=t", back = "=back", drop = "=drop", pitch = "=pitch", stance = "=stance" }
post = [ { fn = "bb_lift_hook", args = { t = "=t", bulge = "=bulge", y_floor = "=y_floor", y_top = "=y_top", z_top = "=z_top", grip = "close" } } ]
