# Wall push-up: stand an arm's length from a wall, the hands on the wall at shoulder height, the body straight. Bend the elbows to bring the chest to the wall and push back. 1.0 s down, 0.2 s hold, 1.0 s up. (The wall is not modelled.)
name = "WallPushUp"
python = ["moves.py", "pushup.py", "poselib.py", "pushup_var.py"]
timeline = [{ frames = [1, 31, 3], pose = "p", set = { u = "=(1-cos(pi*(f-1)/30))/2" } },
            { frames = [37, 67, 3], pose = "p", set = { u = "=(1+cos(pi*(f-37)/30))/2" } }]

[params]
u = 0

[poses.p]
generator = "pushup_variant"
args = { kind = "wall", u = "=u" }
