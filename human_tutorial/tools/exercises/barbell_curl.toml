# Barbell curl: stand tall holding the bar underhand at arm's length against the thighs, hands shoulder width. Curl the bar up by bending the elbows, the upper arms still, squeeze at the top, and lower under control.
name = "BarbellCurl"
python = ["moves.py", "poselib.py", "barbell.py"]
timeline = [{ frames = [1, 37, 3], pose = "curl", set = { k = "=12+128*(1-cos(pi*(f-1)/36))/2" } },
            { frames = [46, 91, 3], pose = "curl", set = { k = "=12+128*(1+cos(pi*(f-46)/45))/2" } }]

[params]
k = 12

[poses.curl]
generator = "bb_curl"
args = { kappa = "=k" }
