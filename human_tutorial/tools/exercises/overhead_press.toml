# Overhead press: the bar racked on the front of the shoulders, hands just outside the shoulders. Press it straight overhead to lockout, then lower it to the shoulders. 1.2 s up, 0.3 s hold, 1.5 s down.
name = "OverheadPress"
python = ["moves.py", "poselib.py", "barbell.py"]
timeline = [{ frames = [1, 37, 3], pose = "press", set = { h = "=(1-cos(pi*(f-1)/36))/2" } },
            { frames = [46, 91, 3], pose = "press", set = { h = "=(1+cos(pi*(f-46)/45))/2" } }]

[params]
h = 0

[poses.press]
generator = "bb_press"
args = { h = "=h" }
