# Lat pulldown: sit under the bar with the knees held by the pads, a wide grip; pull the bar down to the upper chest, the elbows down and out; return. 1.2 s up, 0.3 s hold, 1.5 s down. The machine is not modelled.
name = "LatPulldown"
python = ["moves.py", "poselib.py", "machines.py"]
timeline = [{ frames = [1, 37, 3], pose = "m", set = { h = "=(1-cos(pi*(f-1)/36))/2" } },
            { frames = [46, 91, 3], pose = "m", set = { h = "=(1+cos(pi*(f-46)/45))/2" } }]

[params]
h = 0

[poses.m]
generator = "lat_pulldown"
args = { h = "=h" }
