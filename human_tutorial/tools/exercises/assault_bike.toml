# Assault bike: pedal while pumping the handles back and forth, each hand opposite to its foot. One loop is 30 frames (1.0 s). The machine is not modelled.
name = "AssaultBike"
python = ["moves.py", "poselib.py", "machines.py"]
timeline = [{ frames = [1, 31, 1], pose = "m", set = { psi = "=(f-1)/30*2*pi" } }]

[params]
psi = 0

[poses.m]
generator = "assault_bike"
args = { psi = "=psi" }
