<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gym animations viewer</title>
<style>html,body{margin:0;height:100%;background:#1b1d21;color:#eee;font:14px system-ui}#c{width:100%;height:100%;display:block;touch-action:none}
#bar{position:fixed;left:8px;top:8px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 16px)}button{padding:6px 10px;border-radius:6px;border:1px solid #556;background:#2a2e36;color:#eee;cursor:pointer}button.on{background:#3d6fd1}</style></head>
<body><canvas id="c"></canvas><div id="bar"></div>
<script src="https://cdn.babylonjs.com/v7.54.3/babylon.js"></script>
<script src="https://cdn.babylonjs.com/v7.54.3/loaders/babylonjs.loaders.min.js"></script>
<script>
// Serve the folder over http first (file:// cannot fetch the GLB):  cd human_tutorial && python3 -m http.server 8000  ->  http://localhost:8000/viewer/
const canvas = document.getElementById("c"), engine = new BABYLON.Engine(canvas, true), scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0.1, 0.11, 0.13, 1);
const cam = new BABYLON.ArcRotateCamera("cam", -Math.PI / 2, Math.PI / 2.3, 5, new BABYLON.Vector3(0, 1, 0), scene); cam.attachControl(canvas, true); cam.wheelPrecision = 60; cam.minZ = 0.05;
new BABYLON.HemisphericLight("h", new BABYLON.Vector3(0, 1, 0.3), scene);
const ground = BABYLON.MeshBuilder.CreateGround("floor", { width: 6, height: 6 }, scene); ground.material = new BABYLON.StandardMaterial("g", scene); ground.material.diffuseColor = new BABYLON.Color3(0.25, 0.27, 0.3);
BABYLON.SceneLoader.ImportMeshAsync("", "../exports/", "human_all_animations.glb", scene).then(res => {
  const root = res.meshes[0];                       // glTF is right-handed, Babylon left-handed: the loader adds a mirror on __root__; the model faces the camera we set up
  const bar = document.getElementById("bar"); let current = null;
  res.animationGroups.forEach(g => g.stop());
  const show = (g, b) => { if (current) current.stop(); current = g; g.start(true); [...bar.children].forEach(x => x.classList.toggle("on", x === b)); };
  res.animationGroups.forEach(g => { const b = document.createElement("button"); b.textContent = g.name; b.onclick = () => show(g, b); bar.appendChild(b); });
  if (res.animationGroups.length) bar.children[0].click();
});
engine.runRenderLoop(() => scene.render()); addEventListener("resize", () => engine.resize());
</script></body></html>
