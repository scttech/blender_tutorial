<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gym animations viewer</title>
<style>html,body{margin:0;height:100%;background:#1b1d21;color:#eee;font:14px system-ui}#c{width:100%;height:100%;display:block;touch-action:none}
#bar{position:fixed;left:8px;top:8px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 16px)}button{padding:6px 10px;border-radius:6px;border:1px solid #556;background:#2a2e36;color:#eee;cursor:pointer}button.on{background:#3d6fd1}label{display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:6px;border:1px solid #556;background:#2a2e36}</style></head>
<body><canvas id="c"></canvas><div id="bar"></div>
<script src="https://cdn.babylonjs.com/v7.54.3/babylon.js"></script>
<script src="https://cdn.babylonjs.com/v7.54.3/loaders/babylonjs.loaders.min.js"></script>
<script>
// Serve the folder over http first (file:// cannot fetch the GLB):  cd human_tutorial && python3 -m http.server 8000  ->  http://localhost:8000/viewer/
const canvas = document.getElementById("c"), engine = new BABYLON.Engine(canvas, true), scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0.1, 0.11, 0.13, 1);
const cam = new BABYLON.ArcRotateCamera("cam", -Math.PI / 2, Math.PI / 2.3, 5, new BABYLON.Vector3(0, 1, 0), scene); cam.attachControl(canvas, true); cam.wheelPrecision = 60; cam.minZ = 0.05;
new BABYLON.HemisphericLight("h", new BABYLON.Vector3(0, 1, 0.3), scene);
const ground = BABYLON.MeshBuilder.CreateGround("floor", { width: 6, height: 6 }, scene); ground.material = new BABYLON.StandardMaterial("g", scene); ground.material.diffuseColor = new BABYLON.Color3(0.25, 0.27, 0.3);
BABYLON.SceneLoader.ImportMeshAsync("", "../exports/", "human_all_animations.glb", scene).then(res => {
  const root = res.meshes[0];                       // glTF is right-handed, Babylon left-handed: the loader adds a mirror on __root__; the model faces the camera we set up
  const bar = document.getElementById("bar"); let current = null;
  // skin tone: the body has two materials, "Skin" and "ClothesHairEyes"; setting the Skin material's albedoColor tints the skin (the texture is grey) and leaves the clothes, hair and eyes alone.
  // These are the albedoColor values (LINEAR numbers, like the GLB's baseColorFactor) that give each average skin colour: see exports/skin_tones.json
  const TONES = {
    Original: [0.7169, 0.3594, 0.2301],
    Light: [0.9378, 0.5751, 0.412],
    Fair: [0.7947, 0.4398, 0.2796],
    Medium: [0.602, 0.2542, 0.1302],
    Tan: [0.4398, 0.1727, 0.075],
    Brown: [0.2301, 0.0855, 0.0366],
    Dark: [0.0992, 0.0366, 0.0188] };      // the Skin material's albedoColor, in LINEAR light (the same numbers as the GLB's baseColorFactor)
  const sel = document.createElement("select"); sel.style.cssText = "padding:6px;border-radius:6px;background:#2a2e36;color:#eee;border:1px solid #556";
  for (const k of Object.keys(TONES)) { const o = document.createElement("option"); o.value = JSON.stringify(TONES[k]); o.textContent = "skin: " + k; sel.appendChild(o); }
  sel.onchange = () => { const m = scene.getMaterialByName("Skin"); if (m) { const c = JSON.parse(sel.value); m.albedoColor = new BABYLON.Color3(c[0], c[1], c[2]); } }; bar.appendChild(sel);
  res.animationGroups.forEach(g => g.stop());
  // the props are separate meshes named Kettlebell, Mace and PullupBar: switch off the ones an exercise does not use (or all of them)
  const PROPS = { Kettlebell: /kettlebell|kbswing|goblet(?!squat$)|halo/i, Mace: /mace/i, PullupBar: /pullup|chinup|hangingleg/i,
                  "Dumbbell.L": /dumbbell|hammer|lateral|front ?raise|arnold|reardelt|fly/i, "Dumbbell.R": /dumbbell|hammer|lateral|front ?raise|arnold|reardelt|fly/i,
                  Barbell: /barbell|backsquat|frontsquat|goodmorning|overheadpress|uprightrow|deadlift|row|bench|skull/i, Bench: /bench|fly|skull/i };
  let showProps = true;
  const updateProps = () => { for (const [name, re] of Object.entries(PROPS)) { const m = scene.getMeshByName(name); if (m) m.setEnabled(showProps && !!current && re.test(current.name)); } };
  const box = document.createElement("label"); box.innerHTML = '<input type="checkbox" checked> props'; box.firstChild.onchange = e => { showProps = e.target.checked; updateProps(); }; bar.appendChild(box);
  const show = (g, b) => { if (current) current.stop(); current = g; g.start(true); [...bar.children].forEach(x => x.classList.toggle("on", x === b)); updateProps(); };
  res.animationGroups.forEach(g => { const b = document.createElement("button"); b.textContent = g.name; b.onclick = () => show(g, b); bar.appendChild(b); });
  if (res.animationGroups.length) bar.children[2].click();
});
engine.runRenderLoop(() => scene.render()); addEventListener("resize", () => engine.resize());
</script></body></html>
